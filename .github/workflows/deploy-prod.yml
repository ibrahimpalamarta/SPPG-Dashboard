name: Deploy Production

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  TF_DIR: infra/production
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_region: ${{ vars.GCP_REGION }}
  TF_VAR_image_tag: ${{ github.sha }}
  TF_VAR_smtp_url: ${{ secrets.SMTP_URL }}
  TF_VAR_ai_api_key: ${{ secrets.AI_API_KEY }}
  TF_VAR_public_db_url: ${{ secrets.DATABASE_URL_PUBLIC }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # `environment: production` gates this job behind the required-reviewers
    # rule (Settings -> Environments -> production), scopes vars/secrets, and
    # is the sub claim the Workload Identity binding trusts.
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install, build and test
        working-directory: backend
        run: |
          npm ci
          npm run build
          npm test

      - name: Authenticate to Google Cloud (Workload Identity)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Provision Artifact Registry
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -euo pipefail
          terraform apply -auto-approve -target=module.app.google_artifact_registry_repository.this
          echo "REGISTRY=$(terraform output -raw registry)" >> "$GITHUB_ENV"
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      # Frontends are deliberately not built here yet (enable_frontends = false
      # in infra/production/main.tf). Turning them on = add them to this loop
      # and flip that flag.
      - name: Build and push backend image
        run: |
          docker build -t "$REGISTRY/backend:${{ github.sha }}" backend
          docker push "$REGISTRY/backend:${{ github.sha }}"

      - name: Update migration job
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve -target=module.app.google_cloud_run_v2_job.migrate

      - name: Run database migrations
        working-directory: ${{ env.TF_DIR }}
        run: gcloud run jobs execute "$(terraform output -raw migrate_job)" --region "${{ vars.GCP_REGION }}" --wait

      - name: Terraform Apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve

      - name: Show URLs
        working-directory: ${{ env.TF_DIR }}
        run: terraform output urls
