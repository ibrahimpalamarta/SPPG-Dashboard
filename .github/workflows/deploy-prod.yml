name: Deploy Production

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  id-token: write
  contents: read

env:
  TF_DIR: infra/environments/production

jobs:
  deploy:
    runs-on: ubuntu-latest
    # `environment: production` is what makes the required-reviewers
    # protection rule (configured once, manually, in GitHub Settings ->
    # Environments -> production) gate this job behind manual approval.
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend image
        working-directory: frontend
        run: |
          docker build -t "${{ vars.ECR_FRONTEND_URL }}:${{ github.sha }}" .
          docker push "${{ vars.ECR_FRONTEND_URL }}:${{ github.sha }}"

      - name: Build and push backend image
        working-directory: backend
        run: |
          docker build -t "${{ vars.ECR_BACKEND_URL }}:${{ github.sha }}" .
          docker push "${{ vars.ECR_BACKEND_URL }}:${{ github.sha }}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=production/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}"

      - name: Terraform Apply
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform apply -auto-approve \
            -var="account_id=${{ vars.AWS_ACCOUNT_ID }}" \
            -var="aws_region=${{ vars.AWS_REGION }}" \
            -var="github_org=${{ vars.GITHUB_ORG }}" \
            -var="github_repo=${{ vars.GITHUB_REPO_NAME }}" \
            -var="frontend_image_tag=${{ github.sha }}" \
            -var="backend_image_tag=${{ github.sha }}"

      - name: Show ALB URL
        working-directory: ${{ env.TF_DIR }}
        run: terraform output -raw alb_dns_name
