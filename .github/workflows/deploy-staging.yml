name: Deploy Staging

on:
  push:
    branches: [staging]

permissions:
  id-token: write
  contents: read

# Two overlapping runs would fight over the Terraform state lock. Queue instead
# of cancelling: a half-finished apply is worse than a slow one.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  TF_DIR: infra/environments/staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    # `environment:` is load-bearing twice over: every `vars.*` below is a
    # GitHub Environment variable, and the OIDC sub claim the deploy role
    # trusts is `repo:<org>/<repo>:environment:staging`. Which branches may
    # deploy here is set in Settings -> Environments -> Deployment branches.
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Gate: nothing below runs if this fails, so a broken commit never
      # reaches ECR or Terraform. `npm test` needs no database — it is node's
      # own test runner over .env.test, which is committed with dummy values.
      - name: Install, build and test
        working-directory: backend
        run: |
          npm ci
          npm run build
          npm test

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=staging/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}"

      # Runs before the image is built, and does two jobs at once.
      #
      # It creates the ECR repository the next step pushes to: the repository
      # is part of this stack, so on a fresh environment `docker push` would
      # otherwise fail with "repository does not exist".
      #
      # And it registers the migration task definition against the new image
      # tag WITHOUT rolling the service, so migrations land before the new code
      # serves traffic. RegisterTaskDefinition doesn't check that the image
      # exists, so registering it ahead of the push is safe — run-task below
      # still happens after.
      #
      # The cluster is targeted explicitly because it is NOT a dependency of the
      # migrate task definition: without it, a fresh environment reaches the
      # migration step with no cluster and no ecs_cluster_name output to read.
      # Everything else those two pull in as dependencies — VPC, subnets,
      # security group, RDS, the secret, the log group, the task roles.
      - name: Provision ECR and register migration task definition
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -euo pipefail
          terraform apply -auto-approve \
            -target=module.compute.aws_ecs_cluster.this \
            -target=module.compute.aws_ecs_task_definition.migrate \
            -var="aws_region=${{ vars.AWS_REGION }}" \
            -var="backend_image_tag=${{ github.sha }}" \
            -var="auth0_domain=${{ vars.AUTH0_DOMAIN }}" \
            -var="auth0_audience=${{ vars.AUTH0_AUDIENCE }}" \
            -var="auth0_roles_claim=${{ vars.AUTH0_ROLES_CLAIM }}"
          echo "ECR_BACKEND_URL=$(terraform output -raw ecr_backend_repository_url)" >> "$GITHUB_ENV"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Frontend is deliberately absent from this workflow — frontend/ has no
      # app yet, and its ECS service is pinned to desired_count 0 in Terraform
      # for the same reason. Add a step here once frontend/ has a Dockerfile.
      - name: Build and push backend image
        working-directory: backend
        run: |
          docker build -t "$ECR_BACKEND_URL:${{ github.sha }}" .
          docker push "$ECR_BACKEND_URL:${{ github.sha }}"

      # Staging is scheduled down outside working hours (infra/modules/scheduler):
      # the database is stopped and the service is scaled to zero. A deploy that
      # lands while it is asleep would otherwise fail in the migration step with
      # a bare connection timeout, so wake it first and wait for it.
      - name: Wake staging database
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -euo pipefail
          DB_ID=$(terraform output -raw db_instance_identifier)
          STATUS=$(aws rds describe-db-instances --db-instance-identifier "$DB_ID" \
            --query 'DBInstances[0].DBInstanceStatus' --output text)
          echo "Database $DB_ID is $STATUS"

          if [ "$STATUS" = "stopped" ]; then
            aws rds start-db-instance --db-instance-identifier "$DB_ID" >/dev/null
          fi

          # Also covers the case where the scheduler started it moments ago and
          # it is still in "starting".
          if [ "$STATUS" != "available" ]; then
            echo "Waiting for the database to become available..."
            aws rds wait db-instance-available --db-instance-identifier "$DB_ID"
          fi

      - name: Run database migrations
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -euo pipefail
          CLUSTER=$(terraform output -raw ecs_cluster_name)
          FAMILY=$(terraform output -raw migrate_task_definition_family)
          # Public subnets with a public IP, because staging has no NAT gateway
          # and this task has to reach ECR to pull its image at all.
          SUBNETS=$(terraform output -json task_subnet_ids | jq -r 'join(",")')
          SG=$(terraform output -raw ecs_tasks_security_group_id)
          LOG_GROUP=$(terraform output -raw backend_log_group_name)

          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --launch-type FARGATE \
            --task-definition "$FAMILY" \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=ENABLED}" \
            --query 'tasks[0].taskArn' --output text)
          echo "Migration task: $TASK_ARN"

          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"

          # Surface prisma's own output in this log, not just CloudWatch.
          aws logs get-log-events \
            --log-group-name "$LOG_GROUP" \
            --log-stream-name "migrate/migrate/${TASK_ARN##*/}" \
            --query 'events[].message' --output text || true

          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::prisma migrate deploy exited with $EXIT_CODE"
            exit 1
          fi

      - name: Terraform Apply
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform apply -auto-approve \
            -var="aws_region=${{ vars.AWS_REGION }}" \
            -var="backend_image_tag=${{ github.sha }}" \
            -var="auth0_domain=${{ vars.AUTH0_DOMAIN }}" \
            -var="auth0_audience=${{ vars.AUTH0_AUDIENCE }}" \
            -var="auth0_roles_claim=${{ vars.AUTH0_ROLES_CLAIM }}"

      # Terraform no longer manages desired_count — the off-hours scheduler owns
      # it — so an apply alone will not bring the service back up if it is
      # currently scaled to zero. Deploying is an explicit statement that the
      # environment should be running, so scale it here.
      - name: Scale backend service up
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "$(terraform output -raw ecs_cluster_name)" \
            --service "$(terraform output -raw backend_service_name)" \
            --desired-count "$(terraform output -raw backend_desired_count)" \
            >/dev/null

      # terraform apply returns as soon as UpdateService is accepted, so
      # without this the job goes green while the new tasks are still
      # crash-looping. This is what turns "deployed" into "actually running".
      - name: Wait for backend service to stabilise
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -euo pipefail
          aws ecs wait services-stable \
            --cluster "$(terraform output -raw ecs_cluster_name)" \
            --services "$(terraform output -raw backend_service_name)"

      - name: Show ALB URL
        working-directory: ${{ env.TF_DIR }}
        run: terraform output -raw alb_dns_name
