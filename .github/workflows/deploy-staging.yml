name: Deploy Staging

on:
  push:
    branches: [staging]

permissions:
  id-token: write
  contents: read

# Two overlapping runs would fight over the Terraform state lock. Queue instead
# of cancelling: a half-finished apply is worse than a slow one.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  TF_DIR: infra/staging
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_region: ${{ vars.GCP_REGION }}
  TF_VAR_image_tag: ${{ github.sha }}
  TF_VAR_smtp_url: ${{ secrets.SMTP_URL }}
  TF_VAR_ai_api_key: ${{ secrets.AI_API_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # `environment:` is load-bearing twice over: every `vars.*`/`secrets.*`
    # above is a GitHub Environment value, and the Workload Identity binding
    # trusts the sub claim `repo:<owner>/<repo>:environment:staging`. Which
    # branches may deploy is set in Settings -> Environments -> Deployment branches.
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Gate: nothing below runs if this fails. `npm test` needs no database —
      # node's own test runner over the committed .env.test.
      - name: Install, build and test
        working-directory: backend
        run: |
          npm ci
          npm run build
          npm test

      - name: Authenticate to Google Cloud (Workload Identity)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      # Cloud Run refuses an image that does not exist, so the registry has to
      # exist and the images have to be pushed before anything that runs them.
      - name: Provision Artifact Registry
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -euo pipefail
          terraform apply -auto-approve -target=module.app.google_artifact_registry_repository.this
          echo "REGISTRY=$(terraform output -raw registry)" >> "$GITHUB_ENV"
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      # Frontends are built before the migration on purpose: one that fails to
      # compile fails the job while the database is still untouched. All three
      # carry the same tag — one commit, one deploy.
      - name: Build and push images
        run: |
          set -euo pipefail
          for app in backend frontend-admin frontend-public; do
            docker build -t "$REGISTRY/$app:${{ github.sha }}" "$app"
            docker push "$REGISTRY/$app:${{ github.sha }}"
          done

      # Pulls in Cloud SQL, the secrets and the bucket on a fresh environment,
      # and points the job at the new image WITHOUT rolling the services, so
      # migrations land before the new code serves traffic.
      - name: Update migration job
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve -target=module.app.google_cloud_run_v2_job.migrate

      # Staging's Cloud SQL is stopped outside working hours (Cloud Scheduler,
      # infra/modules/app). Deploying is a statement that it should run.
      - name: Wake staging database
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -euo pipefail
          SQL=$(terraform output -raw sql_instance)
          POLICY=$(gcloud sql instances describe "$SQL" --format='value(settings.activationPolicy)')
          echo "Cloud SQL $SQL activation policy: $POLICY"
          if [ "$POLICY" != "ALWAYS" ]; then
            gcloud sql instances patch "$SQL" --activation-policy=ALWAYS --quiet
          fi

      # --wait exits non-zero when the job fails; prisma's output is in Cloud
      # Logging, linked from the job execution in the console.
      - name: Run database migrations
        working-directory: ${{ env.TF_DIR }}
        run: gcloud run jobs execute "$(terraform output -raw migrate_job)" --region "${{ vars.GCP_REGION }}" --wait

      # Cloud Run's apply waits until each new revision is ready and serving,
      # so a crash-looping container fails this step instead of going green.
      - name: Terraform Apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve

      - name: Show staging URLs
        working-directory: ${{ env.TF_DIR }}
        run: terraform output urls
