name: CI

# Pre-merge gate for all three tiers, plus the only gate `develop` has: it is a
# transit branch with no deploy workflow, so a push straight to it would
# otherwise go unchecked. staging/main stay pull_request-only — a push there
# already runs the matching deploy workflow, which gates on the same build/test
# before it touches AWS. Nothing here is deployed and no AWS credential is ever
# issued: no `environment:`, no `id-token: write`.
on:
  pull_request:
    branches: [develop, staging, main]
  push:
    branches: [develop]

permissions:
  contents: read

# Opposite of the deploy workflows: superseding a stale PR check costs
# nothing, so cancel it rather than queue it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Same three commands the deploy workflows gate on, so a red CI here
      # means a red deploy there — no surprises after merge. `npm test` needs
      # no database: it is node's own test runner over .env.test.
      - name: Install, build and test
        working-directory: backend
        run: |
          npm ci
          npm run build
          npm test

  # Both apps are the same shape, so they share one job definition. This is the
  # only place the frontends are built on a runner: the deploy workflow lets the
  # Docker build be its gate instead, and that build already happens before any
  # migration runs.
  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend-admin, frontend-public]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      # `next build` type-checks as part of building, so this is the type gate
      # too — same arrangement as the backend job. Neither app has tests yet.
      - name: Install and build
        working-directory: ${{ matrix.app }}
        run: |
          npm ci
          npm run build

  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform fmt -check -recursive infra

      # -backend=false: validate needs provider schemas, not the S3 state —
      # this job holds no AWS credentials. Catches broken HCL here instead of
      # halfway through a deploy, after the image is already pushed to ECR.
      - name: Terraform validate
        run: |
          set -euo pipefail
          for dir in infra/backend-bootstrap infra/environments/staging infra/environments/production; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
